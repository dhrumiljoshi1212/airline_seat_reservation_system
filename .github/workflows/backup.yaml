name: Backup Reservation Data

on:
  workflow_dispatch:
  push:
    paths:
      - 'reservation_data.json'
  # schedule:
  #   - cron: '*/5 * * * *'
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: true
    - name: Create backup directory
      run: mkdir -p backups

    - name: Copy reservation_data.json to backup directory
      run: cp reservation_data.json backups/reservation_data_$(date +'%Y%m%d%H%M%S').json

    - name: Debug Git configuration
      run: |
        git config --list
        git status
        git remote -v
        echo "Repository: ${{ github.repository }}"
        echo "Token: ${{ secrets.GH_TOKEN }}"

    - name: Commit and push backups
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}  # Use the custom token
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add backups/
        git commit -m 'Backup reservation_data.json'
        git push
